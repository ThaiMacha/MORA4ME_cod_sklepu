version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mora4me_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopware
      MYSQL_USER: shopware
      MYSQL_PASSWORD: shopware
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - mora4me_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mora4me_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mora4me_network

  # OpenSearch (alternative to Elasticsearch)
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: mora4me_opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1
      - cluster.initial_cluster_manager_nodes=opensearch-node1
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - mora4me_network

  # OpenSearch Dashboards
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: mora4me_opensearch_dashboards
    ports:
      - "5601:5601"
    expose:
      - "5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch
    networks:
      - mora4me_network

  # PHP-FPM with Shopware
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mora4me_php
    volumes:
      - .:/var/www/html
      - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./docker/php/conf.d/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
    depends_on:
      - mysql
      - redis
    networks:
      - mora4me_network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: mora4me_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites/:/etc/nginx/conf.d/
      - ./docker/nginx/ssl/:/etc/nginx/ssl/
    depends_on:
      - php
    networks:
      - mora4me_network

  # Node.js for Frontend Development
  node:
    image: node:18-alpine
    container_name: mora4me_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "3000:3000" # Vite dev server
      - "3001:3001" # Webpack dev server
    command: tail -f /dev/null # Keep container running
    networks:
      - mora4me_network

  # MailHog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mora4me_mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    networks:
      - mora4me_network

  # PhpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: mora4me_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - mora4me_network

volumes:
  mysql_data:
  redis_data:
  opensearch_data:
  node_modules:

networks:
  mora4me_network:
    driver: bridge
